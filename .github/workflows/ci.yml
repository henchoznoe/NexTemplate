name: CI

on:
  workflow_call:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz" | tar xz
          sudo mv gitleaks /usr/local/bin/

      - name: Run gitleaks
        run: gitleaks detect --source . --verbose --redact

  ci:
    name: Lint, Type-check & Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - name: Install dependencies
        if: github.actor != 'dependabot[bot]'
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (Dependabot)
        if: github.actor == 'dependabot[bot]'
        run: pnpm install --frozen-lockfile --trust-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Format & Lint check
        run: pnpm exec biome check .

      - name: Dead code analysis
        run: pnpm exec knip

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm exec next build
        env:
          BETTER_AUTH_SECRET: 'this_is_a_ci_build_placeholder_only'
          BETTER_AUTH_URL: 'http://localhost:3000'
          NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
          GITHUB_CLIENT_ID: 'ci-placeholder'
          GITHUB_CLIENT_SECRET: 'ci-placeholder'

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - name: Install dependencies
        if: github.actor != 'dependabot[bot]'
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (Dependabot)
        if: github.actor == 'dependabot[bot]'
        run: pnpm install --frozen-lockfile --trust-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'

      - name: Run tests
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        if: github.event_name != 'workflow_call'
        uses: codecov/codecov-action@v7.0.0
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
