services:
  # ── Local development database ─────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nextemplate
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # ── Production app (Docker deployment) ─────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/nextemplate
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
