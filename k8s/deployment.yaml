apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextemplate
  labels:
    app: nextemplate
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nextemplate
  template:
    metadata:
      labels:
        app: nextemplate
    spec:
      containers:
        - name: nextemplate
          image: nextemplate:latest # Replace with your registry image
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: HOSTNAME
              value: '0.0.0.0'
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '512Mi'
              cpu: '500m'
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
