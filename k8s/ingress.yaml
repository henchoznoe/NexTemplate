apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextemplate
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: nextemplate.example.com # Replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nextemplate
                port:
                  number: 80
